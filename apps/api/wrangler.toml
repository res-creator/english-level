name = "english-level-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# Default (unnamed) environment = local development, used by `wrangler dev`.
[dev]
port = 8787

# D1 binding, available in the Worker as `env.DB`.
# `database_id` is an obvious placeholder — local `wrangler dev` doesn't
# validate it against Cloudflare, it just uses a local SQLite file. Replace
# it with a real ID (from `wrangler d1 create ...`) before deploying for
# real. Migrations live in the repo-root `migrations/` folder, applied via
# `wrangler d1 migrations apply DB` (see README.md).
[[d1_databases]]
binding = "DB"
database_name = "english-level-db-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"

# Local-only dev fixture, NOT a real Telegram bot token — it only has to
# match apps/web/src/auth/devTelegramFixture.ts's DEV_TELEGRAM_BOT_TOKEN, so
# the frontend's Telegram mock can sign an initData the backend accepts,
# through the exact same validation path real Telegram traffic goes
# through. See docs/authentication.md. Never set this in [env.preview] or
# [env.production] — those must get a real token via `wrangler secret put
# TELEGRAM_BOT_TOKEN --env <env>`, never committed here.
#
# ALLOWED_ORIGINS is NOT a secret — it's the CORS allow-list (comma-
# separated), read by apps/api/src/index.ts. Wrangler does not inherit
# top-level [vars]/[[d1_databases]] into named environments, so every
# [env.*] block below redeclares its own — same pattern already used for
# d1_databases.
#
# ENVIRONMENT gates preview-only testing tools (currently the account
# reset, see src/routes/me.ts). It is set to "preview" ONLY in
# [env.preview.vars] below and is deliberately absent from
# [env.production.vars] — the guard fails closed, so the tools do not
# exist in production.
[vars]
TELEGRAM_BOT_TOKEN = "dev-fixture-telegram-bot-token-000000"
ALLOWED_ORIGINS = "http://localhost:5173"
ENVIRONMENT = "development"

# Deployed via `wrangler deploy --env preview`. See docs/deployment.md.
[env.preview]
name = "english-level-api-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "english-level-db-preview"
database_id = "ec925c1d-745c-4d71-b46f-0ece4e3fee3a"
migrations_dir = "../../migrations"

# TELEGRAM_BOT_TOKEN is intentionally NOT set here: it must be a secret,
# set once via `wrangler secret put TELEGRAM_BOT_TOKEN --env preview`.
[env.preview.vars]
ALLOWED_ORIGINS = "https://english-level-web-preview.res-creator.workers.dev"
# The only place this is ever "preview". Do not copy it into production.
ENVIRONMENT = "preview"

# Deployed via `wrangler deploy --env production`. See docs/deployment.md.
[env.production]
name = "english-level-api-production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "english-level-db-production"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"
migrations_dir = "../../migrations"

# Same as [env.preview.vars] above, pointed at the production web origin.
# TELEGRAM_BOT_TOKEN: `wrangler secret put TELEGRAM_BOT_TOKEN --env production`.
[env.production.vars]
ALLOWED_ORIGINS = "https://REPLACE_WITH_PRODUCTION_WEB_ORIGIN.workers.dev"

# Secrets (API keys, tokens) -> `wrangler secret put <NAME> --env <env>`,
# never committed to this file. Currently only TELEGRAM_BOT_TOKEN.
