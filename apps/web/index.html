<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />

    <title>Speak in English</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

         window.Telegram.WebApp inside a real Telegram client. Without it,
         window.Telegram is undefined even when genuinely running inside
         Telegram, and apps/web/src/telegram/webapp.ts falls back to the
         dev mock. See docs/authentication.md. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
