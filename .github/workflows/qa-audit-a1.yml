name: A1 full learning/content/UX audit (Playwright)

# Manual only. Drives all 5 public A1 situations end to end (every
# regular session round AND the Mission, deliberately failed once then
# retried to pass) against a throwaway local API + D1 this job stands
# up itself, using the same dev-auth fixture and fixes as
# qa-authenticated.yml (see apps/web/qa/run-authenticated.ts's header
# for the full root-cause history). This is a content/UX audit, not a
# regression gate — it records findings, it does not fix anything and
# it is not expected to always fully pass.
#
# Run it: GitHub -> Actions -> "A1 full learning/content/UX audit
# (Playwright)" -> Run workflow. Or: gh workflow run qa-audit-a1.yml
on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-22.04
    # Much longer than qa-authenticated.yml's smoke test: 5 situations,
    # each with several regular rounds plus a deliberate-fail-then-pass
    # double Mission attempt, AND a full-page screenshot plus a dozen+
    # Playwright round-trips per single activity (both required by the
    # audit spec, not something to trim) — run 36238930204 showed this
    # is genuinely ~20s/activity even with no bugs, not a hang; 45min
    # wasn't enough for legitimate work, so this is raised generously
    # rather than chased as a phantom performance bug.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        run: pnpm --filter @english-level/web exec playwright install --with-deps chromium

      - name: Apply D1 migrations (local, throwaway per run)
        working-directory: apps/api
        run: pnpm run migrate:local

      - name: Generate and apply curriculum seed content (local D1)
        run: |
          node --experimental-strip-types apps/api/scripts/generateSeedSql.ts > /tmp/curriculum_seed.sql
          cd apps/api && pnpm exec wrangler d1 execute DB --local --file=/tmp/curriculum_seed.sql

      - name: Start the API (wrangler dev)
        working-directory: apps/api
        run: pnpm run dev > /tmp/wrangler-api.log 2>&1 &

      - name: Start the web app (vite dev)
        working-directory: apps/web
        run: pnpm run dev > /tmp/vite-web.log 2>&1 &

      - name: Wait for both dev servers
        run: |
          for url in http://localhost:8787/api/v1/health http://localhost:5173; do
            echo "waiting for $url"
            for i in $(seq 1 60); do
              if curl -sf "$url" > /dev/null; then
                echo "$url is up"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "$url never came up" >&2
                exit 1
              fi
              sleep 1
            done
          done

      - name: Run the A1 audit
        working-directory: apps/web
        run: pnpm run qa:audit-a1

      - name: Dump server-side error logs (D1 error_logs + dev-server console)
        if: always()
        run: |
          echo "### wrangler dev (API) console output ###"
          cat /tmp/wrangler-api.log || echo "(no API log file)"
          echo ""
          echo "### vite dev (web) console output ###"
          cat /tmp/vite-web.log || echo "(no web log file)"
          echo ""
          echo "### error_logs table (apps/api's own crash log — migrations/0009_error_logs.sql) ###"
          cd apps/api && pnpm exec wrangler d1 execute DB --local \
            --command "SELECT created_at, source, path, message, stack FROM error_logs ORDER BY created_at DESC LIMIT 40;" \
            || echo "(could not query error_logs — D1 may not have started)"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-audit-a1-artifacts
          path: |
            artifacts/qa/audit-a1/
            /tmp/wrangler-api.log
            /tmp/vite-web.log
          retention-days: 14
